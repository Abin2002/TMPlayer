name: Debug APK (Kai features)

# Builds a sign-in-capable debug APK from the kai-features branch, writing the Telegram API
# credentials from the repo's secrets into local.properties the way release.yml does.
#
# Needs TG_API_ID and TG_API_HASH in the fork's Actions secrets
# (Settings > Secrets and variables > Actions). Without them the build fails fast rather
# than producing an APK that stops at "No Telegram API credentials in this build".
#
# Runs on every push to kai-features, or by hand from the Actions tab.
on:
  workflow_dispatch:
  push:
    branches: [kai-features]

permissions:
  contents: read

jobs:
  debug-apk:
    name: Debug APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Write Telegram credentials
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          if [ -z "$TG_API_ID" ] || [ -z "$TG_API_HASH" ]; then
            echo "::error::TG_API_ID/TG_API_HASH secrets are not set; add them in Settings > Secrets and variables > Actions"
            exit 1
          fi
          cat > local.properties <<EOF
          TG_API_ID=$TG_API_ID
          TG_API_HASH=$TG_API_HASH
          EOF

      - name: Run unit tests
        run: ./gradlew :core:jvmTest :ui:jvmTest :app:testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Shred credentials
        if: always()
        run: rm -f local.properties

      - name: Upload the APK
        uses: actions/upload-artifact@v7
        with:
          name: tmplayer-kai-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error
