name: IndexNow

# Tells IndexNow about the pages a push to main changed, so a site change reaches Bing (and through
# it ChatGPT search and Copilot), Yandex, Seznam and Naver within hours, not only a release. The
# release job keeps its own ping for the release's pages; its pushes are made with GITHUB_TOKEN,
# which starts no workflow, so nothing is pinged twice.
on:
  push:
    branches: [main]
    paths: ['site/**']

permissions:
  contents: read
  statuses: read

jobs:
  ping:
    name: Ping IndexNow with the changed pages
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      # The ping must not run before the new pages are live, or a crawler that comes at once reads
      # the old ones. Vercel reports each deployment as a commit status named "Vercel" (pending,
      # then success or failure), newest first. A failed deployment, or none within 20 minutes
      # (Vercel skipped the commit, or is down), sends nothing and leaves the run green: the
      # sitemap tells every engine on its next crawl anyway.
      - name: Wait for Vercel to deploy this commit
        id: deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 1 60); do
            STATE="$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/statuses" \
              --jq '[.[] | select(.context == "Vercel")][0].state // ""')"
            case "$STATE" in
              success)
                echo "ready=true" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              failure|error)
                echo "::notice::Vercel did not deploy ${{ github.sha }} ($STATE); nothing to ping."
                exit 0
                ;;
            esac
            sleep 20
          done
          echo "::notice::No Vercel deployment of ${{ github.sha }} after 20 minutes; nothing to ping."

      # Works out the changed pages (a new lastmod in site/src/data/lastmod.json, or a changed
      # translation catalog) and posts them with the key in site/public/<key>.txt, the one the
      # release job uses. It says so and sends nothing when no indexable page changed.
      - name: Ping IndexNow
        if: steps.deploy.outputs.ready == 'true'
        run: python3 scripts/indexnow-site.py --before "${{ github.event.before }}" --after "${{ github.sha }}"
