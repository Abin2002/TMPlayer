<!doctype html>
<!--
  Source of site/public/og.png, the 1200x630 social preview. It loads the site's own stylesheet in its
  light theme, so the type is Poppins and the TV and phone are the same CSS frames as the home page
  hero, around light screenshots: the desktop's poster grid in the big frame and the phone's chat
  list. Render it with scripts/render-brand.sh, which serves the repository over a local web
  server: Chromium will not load the web fonts from a file:// page.
-->
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../site/src/styles/styles.css">
<!-- The stylesheet names the fonts by their site path (/fonts/...); served from the repository
     root, this card finds them in site/public/fonts/ instead. -->
<style>
  @font-face { font-family: "Poppins"; font-style: normal; font-weight: 400; font-display: swap; src: url("../site/public/fonts/poppins-400.woff2") format("woff2"); }
  @font-face { font-family: "Poppins"; font-style: normal; font-weight: 500; font-display: swap; src: url("../site/public/fonts/poppins-500.woff2") format("woff2"); }
  @font-face { font-family: "Poppins"; font-style: normal; font-weight: 600; font-display: swap; src: url("../site/public/fonts/poppins-600.woff2") format("woff2"); }
  @font-face { font-family: "Poppins"; font-style: normal; font-weight: 700; font-display: swap; src: url("../site/public/fonts/poppins-700.woff2") format("woff2"); }
</style>
<style>
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { position: relative; }
  .copy { position: absolute; left: 60px; top: 56px; width: 600px; }
  .brand { display: flex; align-items: center; gap: 12px; font-weight: 600; font-size: 28px; letter-spacing: -0.01em; }
  .brand svg { width: 48px; height: 48px; }
  h1 { margin: 44px 0 0; font-size: 64px; line-height: 1.04; }
  h1 em { font-style: normal; color: var(--primary); }
  h1 .h1-mark { width: 0.78em; height: 0.78em; vertical-align: -0.04em; }
  .sub { margin: 18px 0 0; font-size: 24px; line-height: 1.4; color: var(--on-surface-variant); max-width: 500px; }
  .foot-row { position: absolute; left: 60px; bottom: 50px; display: flex; align-items: center; gap: 10px; }
  .foot-row span { font-weight: 500; font-size: 18px; line-height: 1.4; padding: 8px 17px; border-radius: var(--shape-full); background: var(--surface-container); color: var(--on-surface); }
  .foot-row .url { margin-left: 12px; font-weight: 600; font-size: 22px; color: var(--primary); }
  .showcase { position: absolute; left: 636px; top: 104px; width: 540px; }
</style>
</head>
<body>
  <div class="copy">
    <div class="brand"><svg viewBox="0 0 108 108" aria-hidden="true"><rect x="0" y="0" width="108" height="108" rx="26" ry="26" fill="#1E1E28"/><path fill="#3A3A46" d="M36,33 H72 A5,5 0 0 1 77,38 V60 A5,5 0 0 1 72,65 H36 A5,5 0 0 1 31,60 V38 A5,5 0 0 1 36,33 Z"/><path fill="#0E0E12" d="M36,34.5 H72 A3.5,3.5 0 0 1 75.5,38 V60 A3.5,3.5 0 0 1 72,63.5 H36 A3.5,3.5 0 0 1 32.5,60 V38 A3.5,3.5 0 0 1 36,34.5 Z"/><path fill="#EDEDF2" d="M48,40.5 L65,49 L48,57.5 Z"/><path fill="#2AABEE" d="M36.5,70 H55.5 A2.5,2.5 0 0 1 55.5,75 H36.5 A2.5,2.5 0 0 1 36.5,70 Z"/><path fill="#3A3A46" d="M66.5,70 H71.5 A2.5,2.5 0 0 1 71.5,75 H66.5 A2.5,2.5 0 0 1 66.5,70 Z"/><circle cx="62" cy="72.5" r="5.5" fill="#EDEDF2"/></svg>TMPlayer</div>
    <h1>Your <svg class="h1-mark" viewBox="0 0 108 108" aria-hidden="true"><rect x="0" y="0" width="108" height="108" rx="26" ry="26" fill="#1E1E28"/><path fill="#3A3A46" d="M36,33 H72 A5,5 0 0 1 77,38 V60 A5,5 0 0 1 72,65 H36 A5,5 0 0 1 31,60 V38 A5,5 0 0 1 36,33 Z"/><path fill="#0E0E12" d="M36,34.5 H72 A3.5,3.5 0 0 1 75.5,38 V60 A3.5,3.5 0 0 1 72,63.5 H36 A3.5,3.5 0 0 1 32.5,60 V38 A3.5,3.5 0 0 1 36,34.5 Z"/><path fill="#EDEDF2" d="M48,40.5 L65,49 L48,57.5 Z"/><path fill="#2AABEE" d="M36.5,70 H55.5 A2.5,2.5 0 0 1 55.5,75 H36.5 A2.5,2.5 0 0 1 36.5,70 Z"/><path fill="#3A3A46" d="M66.5,70 H71.5 A2.5,2.5 0 0 1 71.5,75 H66.5 A2.5,2.5 0 0 1 66.5,70 Z"/><circle cx="62" cy="72.5" r="5.5" fill="#EDEDF2"/></svg> Telegram videos, <em>on every screen</em>.</h1>
    <p class="sub">Play the media in your own chats while it streams. Free and open source.</p>
  </div>

  <div class="foot-row"><span>Android TV</span><span>Android</span><span>Windows</span><span>Linux</span><div class="url">tmplayer.org</div></div>

  <figure class="showcase">
    <div class="device device-tv device-desktop">
      <div class="screen"><img src="../site/public/screenshots/desktop-grid-light.webp" alt=""></div>
      <div class="stand"></div>
      <div class="foot"></div>
    </div>
    <div class="device device-phone">
      <div class="screen"><img src="../site/public/screenshots/phone-chats-light.webp" alt=""></div>
    </div>
  </figure>
</body>
</html>
