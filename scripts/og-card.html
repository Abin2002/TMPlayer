<!doctype html>
<!--
  Source of site/og.png, the 1200x630 social preview. It borrows the site's own stylesheet so
  the TV and phone are the same CSS frames as the home page hero. Render it with:

    scripts/render-brand.sh
-->
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../site/styles.css">
<style>
  html, body { width: 1200px; height: 630px; overflow: hidden; margin: 0; }
  body {
    position: relative;
    color: var(--on-surface);
    background:
      radial-gradient(760px 520px at 84% 46%, rgba(42, 171, 238, 0.17), transparent 64%),
      radial-gradient(520px 360px at 0% 100%, rgba(42, 171, 238, 0.06), transparent 70%),
      var(--surface);
  }
  .copy { position: absolute; left: 72px; top: 66px; width: 470px; }
  .brand { display: flex; align-items: center; gap: 14px; font-weight: 600; font-size: 28px; letter-spacing: -0.01em; }
  .brand svg { width: 56px; height: 56px; }
  h1 { margin: 52px 0 0; font-weight: 700; font-size: 54px; line-height: 1.08; letter-spacing: -0.035em; }
  h1 em { font-style: normal; color: #2aabee; }
  .sub { margin: 22px 0 0; font-size: 20px; line-height: 1.5; color: var(--on-surface-variant); max-width: 400px; }
  .foot-row { position: absolute; left: 72px; bottom: 60px; display: flex; align-items: center; gap: 10px; }
  .foot-row span { font-weight: 500; font-size: 16px; padding: 7px 15px; border-radius: 999px; background: var(--surface-container); border: 1px solid var(--outline-variant); color: var(--on-surface); }
  .foot-row .url { margin-left: 14px; font-weight: 600; font-size: 20px; color: #2aabee; }
  .showcase { position: absolute; left: 556px; top: 112px; width: 590px; margin: 0; }
  .showcase .device-tv { --stand-h: 30px; }
  .showcase .device-tv .screen { --bezel: 7px; }
  .showcase .device-phone { right: -1%; bottom: -18px; width: 20%; }
</style>
</head>
<body>
  <div class="copy">
    <div class="brand">
      <svg viewBox="0 0 108 108" aria-hidden="true"><rect x="0" y="0" width="108" height="108" rx="26" ry="26" fill="#1E1E28"/><path fill="#3A3A46" d="M36,33 H72 A5,5 0 0 1 77,38 V60 A5,5 0 0 1 72,65 H36 A5,5 0 0 1 31,60 V38 A5,5 0 0 1 36,33 Z"/><path fill="#0E0E12" d="M36,34.5 H72 A3.5,3.5 0 0 1 75.5,38 V60 A3.5,3.5 0 0 1 72,63.5 H36 A3.5,3.5 0 0 1 32.5,60 V38 A3.5,3.5 0 0 1 36,34.5 Z"/><path fill="#EDEDF2" d="M48,40.5 L65,49 L48,57.5 Z"/><path fill="#2AABEE" d="M36.5,70 H55.5 A2.5,2.5 0 0 1 55.5,75 H36.5 A2.5,2.5 0 0 1 36.5,70 Z"/><path fill="#3A3A46" d="M66.5,70 H71.5 A2.5,2.5 0 0 1 71.5,75 H66.5 A2.5,2.5 0 0 1 66.5,70 Z"/><circle cx="62" cy="72.5" r="5.5" fill="#EDEDF2"/></svg>
      TMPlayer
    </div>
    <h1>Your Telegram<br>videos, <em>on every<br>screen.</em></h1>
    <p class="sub">Play the media in your own chats while it streams. Free and open source.</p>
  </div>

  <div class="foot-row"><span>Android TV</span><span>Android</span><span>Windows</span><span>Linux</span><div class="url">tmplayer.org</div></div>

  <figure class="showcase">
    <div class="device device-tv">
      <div class="screen"><img src="../site/screenshots/tv-grid.webp" alt=""></div>
      <div class="stand"></div>
      <div class="foot"></div>
    </div>
    <div class="device device-phone">
      <div class="screen"><img src="../site/screenshots/phone-grid.webp" alt=""></div>
    </div>
  </figure>
</body>
</html>
